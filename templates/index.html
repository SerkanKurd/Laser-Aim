<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazer Vuruş Tespiti</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 1rem;
            overflow: hidden;
        }

        header {
            margin-bottom: 0.5rem;
            text-align: center;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 1400px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .top-panel {
            background-color: var(--panel-bg);
            border-radius: 1rem;
            padding: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            gap: 1rem;
            flex-shrink: 0;
        }

        .stat-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex: 1;
            min-width: 120px;
        }

        .stat-card h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .stat-card .value {
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-card.score .value {
            color: var(--success-color);
        }

        button {
            background-color: var(--danger-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            background-color: var(--danger-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .video-container {
            background-color: var(--panel-bg);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0.5rem;
        }

        .settings-btn {
            background-color: #334155;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .settings-btn:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        .audio-warning-banner {
            background: linear-gradient(to right, #f59e0b, #d97706);
            color: #0f172a;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            animation: pulse 2s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1rem;
            border: 1px solid #f59e0b;
            flex-shrink: 0;
            width: 100%;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            }
            50% {
                transform: scale(1.01);
                box-shadow: 0 4px 25px rgba(245, 158, 11, 0.5);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Lazer Hedef Sistemi</h1>
    </header>

    <div class="container">
        <!-- Ses Etkinleştirme Uyarısı -->
        <div id="audio-warning" class="audio-warning-banner">
            ⚠️ Sesli bildirimlerin çalışması için bu çubuğa veya sayfada herhangi bir yere TIKLAYIN!
        </div>
        <!-- Skorlar Üstte -->
        <div class="top-panel">
            <div class="stat-card">
                <h3>Vuruş Sayısı</h3>
                <div class="value" id="hit-count">0</div>
            </div>

            <div class="stat-card score">
                <h3>Toplam Puan</h3>
                <div class="value" id="total-score">0</div>
            </div>

            <a href="/settings" class="settings-btn">⚙️ Ayarlar</a>

            <button id="sound-toggle-btn" class="settings-btn" onclick="toggleSound()" style="background-color: var(--success-color);">
                🔊 Ses Açık
            </button>

            <button onclick="clearHits()">Sıfırla / Temizle</button>
        </div>

        <!-- Video Daha Büyük -->
        <div class="video-container">
            <img src="/video_feed" alt="Kamera Akışı Bekleniyor...">
        </div>
    </div>

    <script>
        // Ses dosyalarını önceden yükle (Sıfır gecikmeli oynatma için)
        const audioFiles = {
            0: new Audio('/static/audio/0.m4a'),
            10: new Audio('/static/audio/10.m4a'),
            20: new Audio('/static/audio/20.m4a'),
            30: new Audio('/static/audio/30.m4a'),
            40: new Audio('/static/audio/40.m4a'),
            50: new Audio('/static/audio/50.m4a')
        };

        // Seslerin hazır olması için yüklemeyi başlat
        Object.values(audioFiles).forEach(audio => {
            audio.load();
        });

        let isSoundEnabled = true;
        let isAudioUnlocked = false;
        let isFirstLoad = true;
        let lastHitCount = 0;
        let lastHitScores = [];

        // Tarayıcı autoplay engellerini aşmak için tıklama/dokunma ile ses motorunun kilidini açma
        function unlockAudio() {
            if (isAudioUnlocked) return;

            // TTS'i uyandır
            if (window.speechSynthesis) {
                const utterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(utterance);
            }

            // Ses dosyalarının kilidini aç (Sessizce başlatip hemen pause et)
            Object.values(audioFiles).forEach(audio => {
                const oldVolume = audio.volume;
                audio.volume = 0;
                audio.play()
                    .then(() => {
                        audio.pause();
                        audio.currentTime = 0;
                        audio.volume = oldVolume;
                    })
                    .catch(e => console.log("Ses kilidi açma:", e));
            });

            isAudioUnlocked = true;

            // Uyarı çubuğunu gizle
            const banner = document.getElementById('audio-warning');
            if (banner) {
                banner.style.display = 'none';
            }

            // Kullanıcıya sesin açıldığını teyit etmek için kısa bir onay sesi çal
            setTimeout(() => {
                if (audioFiles[50]) {
                    audioFiles[50].play().catch(e => console.log("Onay sesi çalınamadı:", e));
                }
            }, 150);
        }

        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const btn = document.getElementById('sound-toggle-btn');
            if (isSoundEnabled) {
                btn.innerHTML = '🔊 Ses Açık';
                btn.style.backgroundColor = 'var(--success-color)';
            } else {
                btn.innerHTML = '🔇 Ses Kapalı';
                btn.style.backgroundColor = '#334155';
            }
        }

        function speakScore(score) {
            if (!isSoundEnabled) return;

            // Eğer önceden kaydedilmiş ses dosyası varsa doğrudan ve anında oynat (Gecikmesiz)
            const audio = audioFiles[score];
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => {
                    console.warn("Ses dosyası oynatılamadı, TTS kullanılıyor:", e);
                    speakWithTTS(score);
                });
            } else {
                speakWithTTS(score);
            }
        }

        function speakWithTTS(score) {
            // Puanları Türkçe yazıya dönüştür
            let text = "";
            if (score === 0) {
                text = "Karavana";
            } else if (score === 10) {
                text = "On puan";
            } else if (score === 20) {
                text = "Yirmi puan";
            } else if (score === 30) {
                text = "Otuz puan";
            } else if (score === 40) {
                text = "Kırk puan";
            } else if (score === 50) {
                text = "Elli puan";
            } else {
                text = score + " puan";
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'tr-TR';
                
                const voices = window.speechSynthesis.getVoices();
                let trVoice = voices.find(v => v.lang === 'tr-TR');
                if (!trVoice) {
                    trVoice = voices.find(v => v.lang.includes('tr') || v.lang.startsWith('tr-'));
                }
                
                if (trVoice) {
                    utterance.voice = trVoice;
                }
                
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateStats() {
            fetch('/stats')
                .then(response => response.json())
                .then(data => {
                    const currentHitCount = data.hit_count;
                    const currentHitScores = data.hit_scores || [];

                    // Sayfa ilk yüklendiğinde eski vuruşları seslendirmemek için başlangıç değerlerini al
                    if (isFirstLoad) {
                        lastHitCount = currentHitCount;
                        lastHitScores = [...currentHitScores];
                        isFirstLoad = false;
                        document.getElementById('hit-count').innerText = currentHitCount;
                        document.getElementById('total-score').innerText = data.total_score;
                        return;
                    }

                    // Eğer vuruş sayısı azaldıysa (Temizleme/Sıfırlama yapıldıysa)
                    if (currentHitCount < lastHitCount) {
                        lastHitCount = currentHitCount;
                        lastHitScores = [...currentHitScores];
                        document.getElementById('hit-count').innerText = currentHitCount;
                        document.getElementById('total-score').innerText = data.total_score;
                        return;
                    }

                    // Yeni vuruş(lar) algılandıysa seslendir
                    if (currentHitCount > lastHitCount) {
                        for (let i = lastHitCount; i < currentHitCount; i++) {
                            const score = currentHitScores[i];
                            speakScore(score);
                        }
                        lastHitCount = currentHitCount;
                        lastHitScores = [...currentHitScores];
                    }

                    document.getElementById('hit-count').innerText = currentHitCount;
                    document.getElementById('total-score').innerText = data.total_score;
                })
                .catch(err => console.error("Stats güncellenemedi:", err));
        }

        function clearHits() {
            fetch('/clear', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    updateStats();
                }
            })
            .catch(err => console.error("Temizleme hatası:", err));
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                // Seslerin arka planda yüklenmesi için tetiklenir
            };
        }

        // Çok daha hızlı algılaması için tarama sıklığını 500ms'den 100ms'e çektik
        setInterval(updateStats, 100);
        updateStats();
    </script>
</body>
</html>
